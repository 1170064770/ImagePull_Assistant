name: Copy Image
on:
  push:
    branches:
      - main
jobs:
  build:
      runs-on: ubuntu-latest
      name: Copy Multi-Architecture Image Job
      steps:
          - name: Actions Version V4
            uses: actions/checkout@v4
          - name: Repo Login
            env:
              REPO_USER: ${{ secrets.REPO_USER }}
              REPO_PWD: ${{ secrets.REPO_PWD }}
            run: |
              set -euo pipefail
              echo "${REPO_PWD}" | skopeo login quay.io --username "${REPO_USER}" --password-stdin
          - name: Tag with Push
            run: |
              set -euo pipefail
              while IFS= read -r image || [ -n "$image" ]; do
                if [[ -z "$image" || "$image" =~ ^[[:space:]]*# ]]; then
                  continue;
                fi
                echo "Starting Copy Image $image ..."
                skopeo copy -a docker://gcr.io/pixie-oss/pixie-dev-public/etcd@sha256:e18afc6dda592b426834342393c4c4bd076cb46fa7e10fa7818952cae3047ca9 docker://quay.io/williamlee/pixie-oss/pixie-dev-public/etcd:3.5.9
                #skopeo copy -a docker://"$image" docker://quay.io/williamlee/${image#*/}
                echo "Succeeded Copy Image "$image
              done < image.list
