name: Copy Image
on:
  push:
    branches:
      - main
jobs:
  build:
      runs-on: ubuntu-latest
      name: Copy Multi-Architecture Image Job
      steps:
          - name: Actions Version V4
            uses: actions/checkout@v4
          - name: Repo Login
            env:
              REPO_USER: ${{ secrets.REPO_USER }}
              REPO_PWD: ${{ secrets.REPO_PWD }}
            run: |
              set -euo pipefail
              echo "${REPO_PWD}" | skopeo login quay.io --username "${REPO_USER}" --password-stdin
          - name: Tag with Push
            run: |
              set -euo pipefail
              while IFS= read -r image || [ -n "$image" ]; do
                if [[ -z "$image" || "$image" =~ ^[[:space:]]*# ]]; then
                  continue;
                fi
                echo "test image manifast"
                docker pull "$image" && echo "test seccess"
                skopeo copy -a docker://ghcr.io/pixie-io/pixie-oss-pixie-dev-public-curl@sha256:f7f265d5c64eb4463a43a99b6bf773f9e61a50aaa7cefaf564f43e42549a01dd docker://quay.io/williamlee/pixie-io/pixie-oss-pixie-dev-public-curl:multiarch-7.87.0
                echo "Starting Copy Image $image ..."
                skopeo copy -a docker://"$image" docker://quay.io/williamlee/${image#*/}
                echo "Succeeded Copy Image "$image
              done < image.list
